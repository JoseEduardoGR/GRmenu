name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Leer version y verificar si ya fue publicada
        id: check
        working-directory: python
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 -E '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION ya tiene tag v$VERSION, no se publica de nuevo."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION es nueva, se publica."
          fi

      - name: Tag release
        if: steps.check.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.check.outputs.version }}"
          git push origin "v${{ steps.check.outputs.version }}"

      - uses: actions/setup-python@v5
        if: steps.check.outputs.should_release == 'true'
        with:
          python-version: "3.x"

      - name: Install build tool
        if: steps.check.outputs.should_release == 'true'
        run: python -m pip install --upgrade build

      - name: Build package
        if: steps.check.outputs.should_release == 'true'
        working-directory: python
        run: python -m build

      - name: Publish to PyPI
        if: steps.check.outputs.should_release == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
